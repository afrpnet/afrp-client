name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-ver.outputs.version }}
      tag: ${{ steps.get-ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: get-ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
      - name: Create release with notes
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          DISCLAIMER='> ⚠️ 鸿蒙版、安卓版、Linux 版未经测试，欢迎多提意见。'
          # --generate-notes：自动汇总上一个 tag 到本 tag 的提交，生成「更新内容」
          gh release create "v$VER" --title "v$VER" --generate-notes || true
          # 在自动生成的更新说明之后追加免责声明（已存在则不重复追加）
          BODY=$(gh release view "v$VER" --json body -q .body 2>/dev/null || echo "")
          if ! printf '%s' "$BODY" | grep -qF "未经测试，欢迎多提意见"; then
            printf '%s\n\n---\n\n%s\n' "$BODY" "$DISCLAIMER" > /tmp/rel-notes.md
            gh release edit "v$VER" --notes-file /tmp/rel-notes.md || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        shell: bash
        run: bash .github/sync-version-ci.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Download frpc (Windows)
        shell: bash
        run: |
          FRPC_VERSION="0.71.0"
          mkdir -p assets/frpc/windows
          curl -sL "https://github.com/fatedier/frp/releases/download/v${FRPC_VERSION}/frp_${FRPC_VERSION}_windows_amd64.zip" -o frpc.zip
          unzip -o -j frpc.zip "*/frpc.exe" -d assets/frpc/windows/
      - name: Build Windows
        run: flutter build windows --release
      - name: Prepare portable
        shell: pwsh
        run: |
          $VER = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -replace '^version:\s+([0-9]+\.[0-9]+\.[0-9]+).*','$1') })
          $STAGE = "build/windows/x64/runner/Release"
          Remove-Item -Recurse -Force "$STAGE/data/flutter_assets/assets/frpc/linux" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$STAGE/data/flutter_assets/assets/frpc/macos" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$STAGE/*" -DestinationPath "dist/afrp-oidc-client_${VER}_windows_amd64_portable.zip" -Force
          Write-Host "Created portable zip:"
          Get-ChildItem dist/ | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
      - name: Prepare installer
        shell: bash
        run: |
          STAGE="build/installer/staging"
          mkdir -p "$STAGE"
          cp -r build/windows/x64/runner/Release/* "$STAGE/"
          rm -rf "$STAGE/data/flutter_assets/assets/frpc/linux"
          rm -rf "$STAGE/data/flutter_assets/assets/frpc/macos"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: powershell
        run: |
          $VER = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -replace '^version:\s+([0-9]+\.[0-9]+\.[0-9]+).*','$1') })
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$VER installer\setup.iss
      - name: Collect installer
        shell: bash
        run: |
          cp build/installer/output/*.exe dist/
      - name: Upload to Release
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "=== Files in dist/ ==="
          ls -la dist/
          echo "=== Uploading ==="
          gh release upload "v$VER" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows arm64 原生构建：需 windows-11-arm runner + Flutter master channel
  # （stable 不发布 Windows arm64 归档）。master 每天在变、可能不稳，故 continue-on-error，
  # 失败不拖累整轮发版；upload 作业 if:always() 仍会跑，R2 按类型键清理会保留其上一个成功版。
  build-windows-arm64:
    needs: create-release
    runs-on: windows-11-arm
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        shell: bash
        run: bash .github/sync-version-ci.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: master
      - name: Download frpc (Windows arm64)
        shell: bash
        run: |
          FRPC_VERSION="0.71.0"
          mkdir -p assets/frpc/windows
          curl -sL "https://github.com/fatedier/frp/releases/download/v${FRPC_VERSION}/frp_${FRPC_VERSION}_windows_arm64.zip" -o frpc.zip
          unzip -o -j frpc.zip "*/frpc.exe" -d assets/frpc/windows/
      - name: Build Windows arm64
        run: flutter build windows --release
      - name: Prepare portable
        shell: pwsh
        run: |
          $VER = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -replace '^version:\s+([0-9]+\.[0-9]+\.[0-9]+).*','$1') })
          $STAGE = "build/windows/arm64/runner/Release"
          if (-not (Test-Path $STAGE)) { throw "expected $STAGE to exist (arm64 build output)" }
          Remove-Item -Recurse -Force "$STAGE/data/flutter_assets/assets/frpc/linux" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$STAGE/data/flutter_assets/assets/frpc/macos" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$STAGE/*" -DestinationPath "dist/afrp-oidc-client_${VER}_windows_arm64_portable.zip" -Force
          Get-ChildItem dist/ | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
      - name: Prepare installer
        shell: bash
        run: |
          STAGE="build/installer/staging"
          mkdir -p "$STAGE"
          cp -r build/windows/arm64/runner/Release/* "$STAGE/"
          rm -rf "$STAGE/data/flutter_assets/assets/frpc/linux"
          rm -rf "$STAGE/data/flutter_assets/assets/frpc/macos"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer (arm64)
        shell: powershell
        run: |
          $VER = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -replace '^version:\s+([0-9]+\.[0-9]+\.[0-9]+).*','$1') })
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$VER /DMyAppArch=arm64 installer\setup.iss
      - name: Collect installer
        shell: bash
        run: |
          cp build/installer/output/*.exe dist/
          ls -la dist/
      - name: Upload to Release
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          ls -la dist/
          gh release upload "v$VER" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: bash .github/sync-version-ci.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Download frpc (macOS ARM64)
        run: |
          FRPC_VERSION="0.71.0"
          mkdir -p assets/frpc/macos
          curl -sL "https://github.com/fatedier/frp/releases/download/v${FRPC_VERSION}/frp_${FRPC_VERSION}_darwin_arm64.tar.gz" -o frpc_arm64.tar.gz
          mkdir -p /tmp/frpc_arm64 && tar -xzf frpc_arm64.tar.gz -C /tmp/frpc_arm64
          tar -czf assets/frpc/macos/frpc_darwin_arm64.tar.gz -C /tmp/frpc_arm64/frp_${FRPC_VERSION}_darwin_arm64 frpc
      - name: Build macOS
        run: flutter build macos --release
      - name: Package & Upload
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          mkdir -p dist
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent "AFRP OIDC Client.app" "../../../../dist/afrp-oidc-client_${VER}_macos_arm64.zip"
          cd ../../../../
          gh release upload "v$VER" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-amd64:
    needs: create-release
    # macos-15-intel 是 GitHub 托管的最后一个 x86_64 macOS 镜像（支持到 2027-08）；
    # macos-latest 现指向 arm64，无法原生产出 Intel 版，故 Intel 版必须固定该标签。
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: bash .github/sync-version-ci.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Download frpc (macOS AMD64)
        run: |
          FRPC_VERSION="0.71.0"
          mkdir -p assets/frpc/macos
          curl -sL "https://github.com/fatedier/frp/releases/download/v${FRPC_VERSION}/frp_${FRPC_VERSION}_darwin_amd64.tar.gz" -o frpc_amd64.tar.gz
          mkdir -p /tmp/frpc_amd64 && tar -xzf frpc_amd64.tar.gz -C /tmp/frpc_amd64
          # 运行时（frpc_manager.dart）与 pubspec 固定读取 frpc_darwin_amd64.tar.gz，文件名须一致
          tar -czf assets/frpc/macos/frpc_darwin_amd64.tar.gz -C /tmp/frpc_amd64/frp_${FRPC_VERSION}_darwin_amd64 frpc
      - name: Build macOS
        run: flutter build macos --release
      - name: Package & Upload
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          mkdir -p dist
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent "AFRP OIDC Client.app" "../../../../dist/afrp-oidc-client_${VER}_macos_amd64.zip"
          cd ../../../../
          gh release upload "v$VER" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-amd64:
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: bash .github/sync-version-ci.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libx11-dev libsecret-1-dev libjson-glib-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Download frpc (Linux amd64)
        run: |
          FRPC_VERSION="0.71.0"
          mkdir -p assets/frpc/linux
          curl -sL "https://github.com/fatedier/frp/releases/download/v${FRPC_VERSION}/frp_${FRPC_VERSION}_linux_amd64.tar.gz" -o frpc.tar.gz
          tar -xzf frpc.tar.gz
          cp frp_${FRPC_VERSION}_linux_amd64/frpc assets/frpc/linux/
      - name: Build Linux
        run: flutter build linux --release
      - name: Package & Upload
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          STAGE="build/linux/x64/release/bundle"
          rm -rf "$STAGE/data/flutter_assets/assets/frpc/windows"
          rm -rf "$STAGE/data/flutter_assets/assets/frpc/macos"
          mkdir -p dist
          tar -czf "dist/afrp-oidc-client_${VER}_linux_amd64.tar.gz" -C "$STAGE" .
          gh release upload "v$VER" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    needs: create-release
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: bash .github/sync-version-ci.sh

      - name: Install Flutter manually
        run: |
          git clone https://github.com/flutter/flutter.git -b stable ~/flutter
          export PATH="$HOME/flutter/bin:$PATH"
          flutter precache
          flutter config --enable-linux-desktop
          flutter config --no-analytics
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libx11-dev libsecret-1-dev libjson-glib-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Download frpc (Linux arm64)
        run: |
          FRPC_VERSION="0.71.0"
          mkdir -p assets/frpc/linux
          curl -sL "https://github.com/fatedier/frp/releases/download/v${FRPC_VERSION}/frp_${FRPC_VERSION}_linux_arm64.tar.gz" -o frpc.tar.gz
          tar -xzf frpc.tar.gz
          cp frp_${FRPC_VERSION}_linux_arm64/frpc assets/frpc/linux/
      - name: Build Linux
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build linux --release
      - name: Package & Upload
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          STAGE="build/linux/arm64/release/bundle"
          rm -rf "$STAGE/data/flutter_assets/assets/frpc/windows"
          rm -rf "$STAGE/data/flutter_assets/assets/frpc/macos"
          mkdir -p dist
          tar -czf "dist/afrp-oidc-client_${VER}_linux_arm64.tar.gz" -C "$STAGE" .
          gh release upload "v$VER" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: bash .github/sync-version-ci.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare assets for mobile build
        run: |
          mkdir -p build/frpc-hold
          for d in windows linux macos; do
            [ -d "assets/frpc/$d" ] && mv "assets/frpc/$d" "build/frpc-hold/$d"
          done
          sed -i -E 's@^([[:space:]]*-[[:space:]]+assets/frpc/(windows|linux|macos)/.*)$@#\1@' pubspec.yaml

      - name: Bundle frpc as native libs (jniLibs)
        run: |
          set -e
          FRPC_VER=0.71.0
          declare -A ABI=( [arm64-v8a]=arm64 [armeabi-v7a]=arm [x86_64]=amd64 )
          for abi in "${!ABI[@]}"; do
            arch="${ABI[$abi]}"
            mkdir -p "android/app/src/main/jniLibs/$abi"
            url="https://github.com/fatedier/frp/releases/download/v${FRPC_VER}/frp_${FRPC_VER}_linux_${arch}.tar.gz"
            echo "下载 $url"
            curl -fsSL "$url" -o /tmp/frp.tgz
            rm -rf /tmp/frpx && mkdir -p /tmp/frpx
            tar -xzf /tmp/frp.tgz -C /tmp/frpx
            src=$(find /tmp/frpx -type f -name frpc | head -1)
            [ -n "$src" ] || { echo "❌ 未找到 frpc ($arch)"; exit 1; }
            cp "$src" "android/app/src/main/jniLibs/$abi/libfrpc.so"
            chmod 755 "android/app/src/main/jniLibs/$abi/libfrpc.so"
            echo "✅ $abi <- frpc linux/$arch ($(stat -c%s "android/app/src/main/jniLibs/$abi/libfrpc.so") bytes)"
          done

      - name: Configure release signing (if secret present)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 有 ANDROID_KEYSTORE_BASE64 时用固定 release 密钥签名，保证各版本签名一致 → 支持覆盖升级。
          # 未配置则跳过，build.gradle.kts 回退 debug 签名（旧行为，覆盖升级仍需先卸载）。
          if [ -z "$KS_B64" ]; then
            echo "⚠️ 未配置 ANDROID_KEYSTORE_BASE64，release 回退 debug 签名。"
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_KEY_PASS"
          } > android/key.properties
          echo "✅ 已写入 release 签名配置（$(stat -c%s android/app/upload-keystore.jks) bytes keystore）"

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK to Release
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/afrp-oidc-client_${VER}_android_all.apk"
          echo "=== Uploading ==="
          ls -la dist/
          gh release upload "v$VER" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ohos:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLUTTER_OHOS_BRANCH: oh-3.41.9-release
      OHOS_CLI_VERSION: 26.0.0.821
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: bash .github/sync-version-ci.sh

      - name: Install Linux deps (libgl1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # hvigorw 优先用 NODE_HOME/bin/node。HarmonyOS command-line-tools 自带 Node >=20.11，
      # 会触发 hvigor 内置 pnpm 8.x 的 ERR_INVALID_THIS(URLSearchParams) bug（@ohos 包只在
      # repo.harmonyos.com，无法换源）。这里先在 setup-ohos 污染 PATH 之前记住 Node 18 目录，
      # Build 步骤再显式把 NODE_HOME/PATH 指回 Node 18，让 hvigor 用 18 跑绕开该 bug。
      - name: Capture Node 18 home
        run: |
          NODE18_BIN=$(readlink -f "$(which node)")
          NODE18_HOME=$(dirname "$(dirname "$NODE18_BIN")")
          echo "NODE18_HOME=$NODE18_HOME" >> "$GITHUB_ENV"
          echo "=== node18 home=$NODE18_HOME ==="
          "$NODE18_HOME/bin/node" -v

      - name: Setup HarmonyOS CLI tools + SDK (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_CLI_VERSION }}
          cache: true

      - name: Prepare FLAT SDK layout + patch component metaVersion
        run: |
          set -e
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          echo "OHOS_NDK_HOME=$OHOS_NDK_HOME"
          # 提前建 FLAT_SDK：<sdk>/26/{ets,js,native,previewer,toolchains} + 26/sdk-pkg.json 标记，
          # 复刻本地 D:\dev\harmony-sdk\26\ 布局。必须在 Clone 步骤前，好让 flutter config
          # --ohos-sdk 指向它，从而 flutter 回写 local.properties 时 hwsdk.dir 也是 FLAT_SDK
          # （否则 hwsdk.dir 被写成原生 default/openharmony 布局，hvigor 从中解析不到 ArkTS:26）。
          FLAT_SDK="$HOME/ohos-sdk-flat"
          rm -rf "$FLAT_SDK"
          mkdir -p "$FLAT_SDK/26"
          for c in ets js native previewer toolchains; do
            ln -sfn "$OHOS_NDK_HOME/$c" "$FLAT_SDK/26/$c"
          done
          printf '{\n  "data": {\n    "apiVersion": "26"\n  }\n}\n' > "$FLAT_SDK/26/sdk-pkg.json"
          # 根因（run 38495733660 验证）：setup-ohos 装的 SDK 组件元数据是 metaVersion 3.0.2，
          # 而 flutter-ohos fork 锁定的 hvigor 5.19.8 解析不了 3.0.2 → 报 "Unable to find components"。
          # 本地能跑通的 SDK 5 个组件全是 metaVersion 3.0.0。把真实组件文件（FLAT 软链指向它们）
          # 的 metaVersion 统一降回 3.0.0，仅改这一个字段，version 等其余保留原值。仅影响本次 CI。
          for c in ets js native previewer toolchains; do
            f="$OHOS_NDK_HOME/$c/oh-uni-package.json"
            [ -f "$f" ] || continue
            sed -i 's/"metaVersion"[[:space:]]*:[[:space:]]*"[^"]*"/"metaVersion": "3.0.0"/' "$f"
          done
          echo "=== FLAT_SDK/26 ==="
          ls -la "$FLAT_SDK/26"
          echo "FLAT_SDK=$FLAT_SDK" >> "$GITHUB_ENV"

      - name: Clone flutter-ohos fork (full clone, with tags)
        run: |
          set -e
          git clone https://gitcode.com/openharmony-sig/flutter_flutter.git -b "$FLUTTER_OHOS_BRANCH" "$HOME/flutter-ohos"
          export PATH="$HOME/flutter-ohos/bin:$PATH"
          echo "=== git describe ==="
          git -C "$HOME/flutter-ohos" describe --tags || echo "(describe failed)"
          flutter config --no-analytics
          # 指向 FLAT_SDK（带 26/ api 层），flutter 会把它持久化并回写 local.properties 的
          # hwsdk.dir；若指原生 $HOS_SDK_HOME（default/openharmony 无 api 层）hvigor 找不到 ArkTS:26。
          flutter config --ohos-sdk "$FLAT_SDK" || true
          echo "=== flutter --version ==="
          flutter --version || true

      - name: Prepare assets for mobile build
        run: |
          mkdir -p build/frpc-hold
          for d in windows linux macos; do
            [ -d "assets/frpc/$d" ] && mv "assets/frpc/$d" "build/frpc-hold/$d"
          done
          sed -i -E 's@^([[:space:]]*-[[:space:]]+assets/frpc/(windows|linux|macos)/.*)$@#\1@' pubspec.yaml

      - name: Write ohos/local.properties
        run: |
          {
            echo "sdk.dir=$FLAT_SDK"
            echo "hwsdk.dir=$FLAT_SDK"
            echo "nodejs.dir=$NODE18_HOME"
            echo "flutter.sdk=$HOME/flutter-ohos"
          } > ohos/local.properties
          echo "=== local.properties ==="
          cat ohos/local.properties

      - name: Configure npm registry (~/.npmrc)
        run: |
          # hvigor 安装阶段会读取 $HOME/.npmrc，缺失会 ENOENT 直接失败
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://registry.npmmirror.com/
          @ohos:registry=https://repo.harmonyos.com/npm/
          EOF
          sed -i 's/^[[:space:]]*//' "$HOME/.npmrc"
          cat "$HOME/.npmrc"

      - name: Build HAP (debug)
        run: |
          set -e
          export PATH="$HOME/flutter-ohos/bin:$PATH"
          export DEVECO_SDK_HOME="$FLAT_SDK"
          export OHOS_BASE_SDK_HOME="$FLAT_SDK"
          # 强制 hvigor 用 Node 18（绕开 command-line-tools 自带 Node>=20.11 触发的 pnpm ERR_INVALID_THIS）
          export NODE_HOME="$NODE18_HOME"
          export PATH="$NODE_HOME/bin:$PATH"
          # hvigor 优先读 env 里的 SDK 路径（而非 local.properties），统一指到 FLAT。
          export HOS_SDK_HOME="$FLAT_SDK"
          export OHOS_SDK_HOME="$FLAT_SDK"
          node -v
          echo "=== flutter pub get ==="
          flutter pub get
          # flutter-ohos 的 hvigorw 需要 hvigor-config.json5 里的 hvigorVersion 字段来选引擎版本，
          # 但原版 npm @ohos/hvigor 的 res/hvigor-config-schema.json 的 propertyNames.enum 不含该字段 →
          # PreBuild 阶段 "00303038 Schema validate failed, propertyName: hvigorVersion"。这里复刻本地补丁：
          # 先触发一次安装（校验会失败，忽略），再给装好的 schema 注入 hvigorVersion。
          echo "=== pre-install hvigor (trigger download; schema validation may fail, ignored) ==="
          ( cd ohos && bash hvigorw clean --no-daemon -p product=default ) || true
          cat > /tmp/patch-hvigor-schema.js <<'EOF'
          const fs = require('fs');
          const p = process.argv[2];
          let s;
          try { s = JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) { console.error('skip (parse fail): ' + p); process.exit(0); }
          let changed = false;
          if (s.propertyNames && Array.isArray(s.propertyNames.enum) && !s.propertyNames.enum.includes('hvigorVersion')) {
            s.propertyNames.enum.unshift('hvigorVersion'); changed = true;
          }
          s.properties = s.properties || {};
          if (!s.properties.hvigorVersion) { s.properties.hvigorVersion = { type: 'string' }; changed = true; }
          if (changed) {
            try { fs.chmodSync(p, 0o644); } catch (e) {}
            fs.writeFileSync(p, JSON.stringify(s, null, 2));
            console.log('patched: ' + p);
          } else { console.log('already ok: ' + p); }
          EOF
          echo "=== patch installed hvigor-config-schema.json to allow hvigorVersion ==="
          find "$HOME/.hvigor" "$(pwd)/ohos" -path '*@ohos/hvigor/res/hvigor-config-schema.json' 2>/dev/null | while read -r SCHEMA; do
            chmod u+w "$SCHEMA" 2>/dev/null || true
            node /tmp/patch-hvigor-schema.js "$SCHEMA"
          done
          echo "=== flutter build hap --debug ==="
          # hvigor 无可用 signingConfig 时会优雅跳过签名、产出 UNSIGNED hap，assembleHap 成功；
          # 但 flutter_tools 事后找不到已签名 hap 会打印“请通过 DevEco 配置调试签名”并 exit 1。
          # CI 无 DevEco，故这里容忍该退出码，改由下一步用 SDK 自带材料手工 sign-app。
          flutter build hap --debug || echo "!! flutter_tools 签名门退出（CI 预期，稍后手工签名）"
          echo "=== locate unsigned hap ==="
          find . -name '*.hap' -type f 2>/dev/null | grep -v oh_modules | xargs -r ls -la || true

      - name: Sign HAP (AGC release material if provided, else OpenHarmony self-sign)
        env:
          # AGC 正式签名材料（可选）。齐备则用华为发布证书/Profile 正式签名（真机可装、可上架）；
          # 缺任一则回落到 SDK 自带 OpenHarmony CA 自签（仅开发者模式/模拟器）。
          # 二进制材料（.p12/.cer/.p7b）以 base64 存进 GitHub Secrets。口令/别名亦走 Secrets。
          OHOS_AGC_KEYSTORE_B64: ${{ secrets.OHOS_AGC_KEYSTORE_B64 }}
          OHOS_AGC_KEYSTORE_PWD: ${{ secrets.OHOS_AGC_KEYSTORE_PWD }}
          OHOS_AGC_KEY_ALIAS: ${{ secrets.OHOS_AGC_KEY_ALIAS }}
          OHOS_AGC_KEY_PWD: ${{ secrets.OHOS_AGC_KEY_PWD }}
          OHOS_AGC_CERT_B64: ${{ secrets.OHOS_AGC_CERT_B64 }}
          OHOS_AGC_PROFILE_B64: ${{ secrets.OHOS_AGC_PROFILE_B64 }}
          OHOS_AGC_COMPAT_VERSION: ${{ secrets.OHOS_AGC_COMPAT_VERSION }}
        run: |
          set -e
          REPO="$(pwd)"
          TC="$OHOS_NDK_HOME/toolchains/lib"
          ST="$TC/hap-sign-tool.jar"
          [ -f "$ST" ] || { echo "!! hap-sign-tool.jar 不在 $TC"; ls -la "$TC" 2>/dev/null || true; exit 1; }

          # 定位 hvigor 产出的未签名 hap（两条签名路径共用）
          UNSIGNED=$(find "$REPO" -name '*unsigned*.hap' -type f 2>/dev/null | grep -v oh_modules | head -1)
          [ -n "$UNSIGNED" ] || UNSIGNED=$(find "$REPO" -name '*.hap' -type f 2>/dev/null | grep -v oh_modules | head -1)
          echo "UNSIGNED=$UNSIGNED"
          [ -n "$UNSIGNED" ] || { echo "!! 找不到未签名 hap"; exit 1; }
          mkdir -p "$REPO/build/ohos/outputs"
          SIGNED="$REPO/build/ohos/outputs/afrp-oidc-client-ohos-arm64.hap"

          if [ -n "$OHOS_AGC_KEYSTORE_B64" ] && [ -n "$OHOS_AGC_CERT_B64" ] && [ -n "$OHOS_AGC_PROFILE_B64" ] \
             && [ -n "$OHOS_AGC_KEYSTORE_PWD" ] && [ -n "$OHOS_AGC_KEY_PWD" ] && [ -n "$OHOS_AGC_KEY_ALIAS" ]; then
            echo "=== 检测到 AGC 正式材料 → 华为发布证书签名（真机/上架可用）==="
            W="$HOME/ohsign-agc"; rm -rf "$W"; mkdir -p "$W"; cd "$W"
            printf '%s' "$OHOS_AGC_KEYSTORE_B64" | base64 -d > agc.p12
            printf '%s' "$OHOS_AGC_CERT_B64"     | base64 -d > agc.cer
            printf '%s' "$OHOS_AGC_PROFILE_B64"  | base64 -d > agc.p7b
            echo "material bytes: p12=$(wc -c < agc.p12) cer=$(wc -c < agc.cer) p7b=$(wc -c < agc.p7b)"
            # AGC 下发的 .p7b 已是华为签名的 release profile → profileSigned 1。
            java -jar "$ST" sign-app -mode localSign -keyAlias "$OHOS_AGC_KEY_ALIAS" -keyPwd "$OHOS_AGC_KEY_PWD" -appCertFile agc.cer -profileFile agc.p7b -profileSigned 1 -inFile "$UNSIGNED" -signAlg SHA256withECDSA -keystoreFile agc.p12 -keystorePwd "$OHOS_AGC_KEYSTORE_PWD" -outFile "$SIGNED" -compatibleVersion "${OHOS_AGC_COMPAT_VERSION:-26}" -signCode 1
            echo "=== AGC 正式签名完成 ==="
            ls -la "$SIGNED"
            exit 0
          fi

          echo "=== 未提供完整 AGC 材料 → 回落 OpenHarmony SDK 自签（开发者模式/模拟器可装，不可上架）==="
          # 用 SDK 自带的 OpenHarmony CA 材料在 CI 内自签：新建 app 密钥→CSR→CA 签出证书链→
          # 写进 release profile 模板→sign-profile→sign-app。全部口令 123456（OpenHarmony.p12 默认）。
          BUNDLE=$(node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");const m=s.match(/bundleName"?\s*:\s*"([^"]+)"/);console.log(m?m[1]:"")' "$REPO/ohos/AppScope/app.json5")
          echo "BUNDLE=$BUNDLE"
          [ -n "$BUNDLE" ] || { echo "!! 读不到 bundleName"; exit 1; }
          W="$HOME/ohsign"; rm -rf "$W"; mkdir -p "$W"; cd "$W"
          NOW=$(date +%s); AFTER=$((NOW + 315360000))
          ISSUER_CA="C=CN,O=OpenHarmony,OU=OpenHarmony Team,CN=OpenHarmony Application CA"
          SUBJ="C=CN,O=OpenHarmony,OU=OpenHarmony Team,CN=OpenHarmony Application Release"
          echo "=== 1) app keypair ==="
          java -jar "$ST" generate-keypair -keyAlias "afrp_app" -keyPwd 123456 -keyAlg ECC -keySize NIST-P-256 -keystoreFile app.p12 -keystorePwd 123456
          echo "=== 2) csr ==="
          java -jar "$ST" generate-csr -keyAlias "afrp_app" -keyPwd 123456 -subject "$SUBJ" -signAlg SHA256withECDSA -keystoreFile app.p12 -keystorePwd 123456 -outFile app.csr
          echo "=== export CA + root certs ==="
          keytool -exportcert -rfc -alias "openharmony application ca" -keystore "$TC/OpenHarmony.p12" -storepass 123456 -file subca.cer
          keytool -exportcert -rfc -alias "openharmony application root ca" -keystore "$TC/OpenHarmony.p12" -storepass 123456 -file rootca.cer
          echo "=== 3) app cert chain (signed by Application CA) ==="
          java -jar "$ST" generate-app-cert -keyAlias "afrp_app" -keyPwd 123456 -issuer "$ISSUER_CA" -issuerKeyAlias "openharmony application ca" -issuerKeyPwd 123456 -subject "$SUBJ" -validity 3650 -signAlg SHA256withECDSA -rootCaCertFile rootca.cer -subCaCertFile subca.cer -keystoreFile app.p12 -keystorePwd 123456 -issuerKeystoreFile "$TC/OpenHarmony.p12" -issuerKeystorePwd 123456 -outForm certChain -outFile appchain.cer
          echo "appchain certs: $(grep -c 'BEGIN CERT' appchain.cer)"
          echo "=== 4) build profile.json (embed leaf cert + bundle-name + fresh validity) ==="
          node -e '
            const fs = require("fs");
            const chain = fs.readFileSync("appchain.cer", "utf8");
            const leaf = chain.match(/-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----/)[0].trim();
            const p = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
            p["bundle-info"]["bundle-name"] = process.argv[4];
            p["bundle-info"]["distribution-certificate"] = leaf + "\n";
            p.validity["not-before"] = Number(process.argv[1]);
            p.validity["not-after"] = Number(process.argv[2]);
            fs.writeFileSync("profile.json", JSON.stringify(p, null, 4));
            console.log("profile.json bundle=" + p["bundle-info"]["bundle-name"]);
          ' "$NOW" "$AFTER" "$TC/UnsgnedReleasedProfileTemplate.json" "$BUNDLE"
          echo "=== 5) sign-profile ==="
          java -jar "$ST" sign-profile -mode localSign -keyAlias "openharmony application profile release" -keyPwd 123456 -profileCertFile "$TC/OpenHarmonyProfileRelease.pem" -inFile profile.json -signAlg SHA256withECDSA -keystoreFile "$TC/OpenHarmony.p12" -keystorePwd 123456 -outFile release.p7b
          echo "=== 6) sign-app ==="
          java -jar "$ST" sign-app -mode localSign -keyAlias "afrp_app" -keyPwd 123456 -appCertFile appchain.cer -profileFile release.p7b -profileSigned 1 -inFile "$UNSIGNED" -signAlg SHA256withECDSA -keystoreFile app.p12 -keystorePwd 123456 -outFile "$SIGNED" -compatibleVersion 26 -signCode 1
          echo "=== signed hap ==="
          ls -la "$SIGNED"

      - name: Upload HAP artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohos-hap
          path: |
            build/ohos/**/*.hap
          if-no-files-found: warn

      - name: Upload HAP to Release
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          mkdir -p dist
          SIGNED="build/ohos/outputs/afrp-oidc-client-ohos-arm64.hap"
          if [ -f "$SIGNED" ]; then
            cp "$SIGNED" "dist/afrp-oidc-client_${VER}_ohos_arm64.hap"
            ls -la dist/
            gh release upload "v$VER" dist/* --clobber
          else
            echo "ERROR: signed HAP not found"
            find build/ohos -type f -name "*.hap" || true
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-openwrt:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: bash .github/sync-version-ci.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zlib
      - name: Check PHP syntax
        run: |
          cd openwrt
          php -l tools/build-ipk.php
      - name: Build ipk + apk
        id: build
        run: |
          cd openwrt
          set +e
          php tools/build-ipk.php --verify > build.log 2>&1
          BUILD_EXIT=$?
          set -e
          if [ "$BUILD_EXIT" != "0" ]; then
            echo "## build-ipk.php failed (exit $BUILD_EXIT)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -40 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -20 build.log | sed 's/^/::error::/'
            exit $BUILD_EXIT
          fi
          cat build.log
          mkdir -p ../dist ../opkg/noarch
          cp dist/*.ipk ../dist/
          cp dist/luci-app-afrp-*.tar.gz ../dist/
          rm -f ../opkg/*.ipk ../opkg/Packages ../opkg/Packages.gz
          rm -f ../opkg/*.apk ../opkg/packages.adb ../opkg/APKINDEX.tar.gz
          rm -f ../opkg/noarch/*.apk ../opkg/noarch/packages.adb ../opkg/noarch/APKINDEX.tar.gz
          cp dist/*.ipk ../opkg/
          cp dist/Packages ../opkg/
          cp dist/Packages.gz ../opkg/
          # apk-tools v3 产物：.apk + packages.adb（docker 不可用时不会生成）
          if [ -f dist/packages.adb ]; then
            cp dist/*.apk ../dist/
            cp dist/packages.adb ../dist/
            cp dist/*.apk ../opkg/
            cp dist/packages.adb ../opkg/
            cp dist/*.apk ../opkg/noarch/
            cp dist/packages.adb ../opkg/noarch/
          else
            echo "::warning::未生成 packages.adb（容器 apk 打包被跳过）"
          fi
          exit $BUILD_EXIT
      - name: apk-tools v3 self-check
        if: hashFiles('dist/packages.adb') != ''
        run: |
          echo "=== 容器内校验 .apk 与 packages.adb ==="
          docker run --rm -v "$PWD/dist:/dist" alpine:3.23 sh -c '
            set -e
            apk --version
            echo "--- apk info ---"
            apk info --description /dist/luci-app-afrp-*.apk || echo "(apk info 不支持文件参数，跳过)"
            echo "--- adbdump packages.adb ---"
            apk adbdump /dist/packages.adb
          ' | tee dist/apk-selfcheck.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log
          path: |
            openwrt/build.log
            dist/apk-selfcheck.log
      - name: Upload to Release
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "=== 检查 dist/ 目录 ==="
          ls -la dist/ || echo "dist/ 目录不存在"
          echo "=== 上传文件到 Release v$VER ==="
          # packages.adb（apk 源索引）与 apk-selfcheck.log（构建日志）只服务网站 opkg/apk 源，
          # 对 release 终端用户无用；仅上传用户可见交付物（.ipk / .apk / .tar.gz）。
          UPLOAD=()
          for f in dist/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              packages.adb|apk-selfcheck.log) continue ;;
            esac
            UPLOAD+=("$f")
          done
          gh release upload "v$VER" "${UPLOAD[@]}" --clobber 2>&1 || echo "上传失败"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 上传构建产物到云存储并更新 manifest
  upload-and-update-manifest:
    needs: [build-windows, build-windows-arm64, build-macos-arm64, build-macos-amd64, build-linux-amd64, build-linux-arm64, build-android, build-ohos, build-openwrt]
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 Release 产物
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          mkdir -p dist
          cd dist
          gh release download "v$VER" --pattern '*' --clobber || echo "⚠️ 部分文件下载失败，继续处理"
          ls -la
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理旧版本文件
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "当前版本: $VER"
          echo "清理前的文件列表："
          ls -lh dist/ || true
          
          # 删除不是当前版本的文件
          for f in dist/*; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")
            
            # 提取文件中的版本号（下划线或连字符分隔）
            if [[ "$filename" =~ _([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              file_ver="${BASH_REMATCH[1]}"
            elif [[ "$filename" =~ -([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              file_ver="${BASH_REMATCH[1]}"
            else
              continue
            fi
            if [ "$file_ver" != "$VER" ]; then
              echo "删除旧版本文件: $filename (版本 $file_ver)"
              rm -f "$f"
            fi
          done
          
          echo "清理后的文件列表："
          ls -lh dist/ || true

      - name: 更新 OpenWrt opkg/apk 源
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          IPK_FILE=$(ls dist/luci-app-afrp_${VER}_all.ipk 2>/dev/null || true)
          
          if [ -z "$IPK_FILE" ]; then
            echo "⚠️ 未找到 OpenWrt ipk 文件，跳过 opkg 源更新"
            exit 0
          fi
          
          echo "=== 更新 opkg 源到 v${VER} ==="
          
          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 清理并复制新文件
          rm -f opkg/*.ipk opkg/Packages opkg/Packages.gz
          rm -f opkg/*.apk opkg/packages.adb opkg/APKINDEX.tar.gz
          rm -f opkg/noarch/*.apk opkg/noarch/packages.adb opkg/noarch/APKINDEX.tar.gz
          mkdir -p opkg/noarch
          cp "$IPK_FILE" opkg/
          
          APK_FILE=$(ls dist/luci-app-afrp-${VER}-r*.apk 2>/dev/null | head -1 || true)
          ADB_FILE=$(ls dist/packages.adb 2>/dev/null || true)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" opkg/
            cp "$APK_FILE" opkg/noarch/
            echo "✅ apk 包已复制: $(basename "$APK_FILE")"
          else
            echo "⚠️ 未找到 apk 包"
          fi
          if [ -n "$ADB_FILE" ]; then
            cp "$ADB_FILE" opkg/
            cp "$ADB_FILE" opkg/noarch/
            echo "✅ packages.adb 已复制"
          else
            echo "⚠️ 未找到 packages.adb（apk 源未更新）"
          fi
          
          # 生成 Packages 文件
          SIZE=$(stat -c%s "$IPK_FILE" 2>/dev/null || stat -f%z "$IPK_FILE")
          SHA256=$(sha256sum "$IPK_FILE" | cut -d' ' -f1)
          
          cat > opkg/Packages << EOF
          Package: luci-app-afrp
          Version: ${VER}
          Depends: luci-base, uclient-fetch, ca-bundle, frpc
          License: MIT
          Section: luci
          Architecture: all
          Installed-Size: 60
          Filename: luci-app-afrp_${VER}_all.ipk
          Size: ${SIZE}
          SHA256sum: ${SHA256}
          Description: AFRP frpc tunnel management by afrp.net
          
          EOF
          
          # 去掉每行开头的空格（heredoc 缩进问题）
          sed -i 's/^[[:space:]]*//' opkg/Packages
          
          gzip -kf opkg/Packages
          
          echo "📦 Packages 内容："
          cat opkg/Packages
          
          # 提交并推送
          git add opkg/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update opkg feed to v${VER}"
            git checkout -b temp-opkg-update
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin temp-opkg-update:main && break
              echo "push 冲突，重试 ($i/3)…"
              sleep 2
            done
            echo "✅ opkg 源已更新到 v${VER}"
            
            # 触发 GitHub Pages 部署
            gh workflow run "Deploy GitHub Pages" --ref main
            echo "✅ 已触发 GitHub Pages 部署"
          else
            echo "ℹ️ opkg 源无变化"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理 R2 旧版本文件
        if: env.R2_ACCOUNT_ID != ''
        continue-on-error: true
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "当前版本: $VER"
          echo "检查 R2 中的旧版本文件（每个类型保留最近 2 个版本）..."

          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="auto"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # 列出 R2 app/ 目录下的所有文件
          FILES=$(aws s3 ls "s3://${R2_BUCKET}/app/" --endpoint-url "$ENDPOINT" 2>/dev/null | awk '{print $4}' || echo "")

          # 本次成功产出的新版产物「类型键」集合（把版本号归一为 <VER>）。
          # 用于把「即将上传的当前版」并入候选版本，从而正确计算每类型最近 2 版。
          declare -A HAVE_NEW
          for f in dist/*; do
            [ -f "$f" ] || continue
            key=$(basename "$f" | sed -E 's/[_-][0-9]+\.[0-9]+\.[0-9]+/_<VER>/')
            HAVE_NEW["$key"]=1
          done

          if [ -z "$FILES" ]; then
            echo "R2 中没有文件，无需清理"
          else
            # 按类型键收集 R2 中已存在的版本
            declare -A KEYVERS
            for FILE in $FILES; do
              if [[ "$FILE" =~ [_-]([0-9]+\.[0-9]+\.[0-9]+) ]]; then
                FV="${BASH_REMATCH[1]}"
                KEY=$(echo "$FILE" | sed -E 's/[_-][0-9]+\.[0-9]+\.[0-9]+/_<VER>/')
                KEYVERS["$KEY"]+="$FV"$'\n'
              fi
            done

            # 每个类型键：候选版本 = R2 已有版本 ∪（本次将上传的 VER，若该类型有新版）；
            # 版本降序去重后保留最近 2 个，其余标记删除。
            # 兜底不变：某平台本次失败 → 候选只有 R2 旧版 → 其最新版仍在 top2 被保留，
            # manifest 指向它，下载不断链。
            declare -A KEEPVER
            for KEY in "${!KEYVERS[@]}"; do
              CAND="${KEYVERS[$KEY]}"
              if [ -n "${HAVE_NEW[$KEY]:-}" ]; then
                CAND+="$VER"$'\n'
              fi
              TOP2=$(printf '%s' "$CAND" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -u -V -r | head -2)
              for V in $TOP2; do
                KEEPVER["$KEY|$V"]=1
              done
              echo "类型 $KEY → 保留版本: $(echo $TOP2 | tr '\n' ' ')"
            done

            DELETED=0
            KEPT=0
            for FILE in $FILES; do
              if [[ "$FILE" =~ [_-]([0-9]+\.[0-9]+\.[0-9]+) ]]; then
                FV="${BASH_REMATCH[1]}"
                KEY=$(echo "$FILE" | sed -E 's/[_-][0-9]+\.[0-9]+\.[0-9]+/_<VER>/')
                if [ -n "${KEEPVER[$KEY|$FV]:-}" ]; then
                  KEPT=$((KEPT + 1))
                else
                  echo "删除旧版本: $FILE (版本 $FV，该类型已保留最近 2 版)"
                  aws s3 rm "s3://${R2_BUCKET}/app/$FILE" --endpoint-url "$ENDPOINT" 2>/dev/null || true
                  DELETED=$((DELETED + 1))
                fi
              fi
            done
            echo "✅ R2 清理完成：删除 $DELETED 个旧版本，保留 $KEPT 个（每类型最近 2 版）"
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: 上传所有产物到 Cloudflare R2（app/）
        if: env.R2_ACCOUNT_ID != ''
        continue-on-error: true
        run: |
          chmod +x .github/scripts/upload-r2.sh
          uploaded_count=0
          failed_count=0
          for f in dist/*; do
            [ -f "$f" ] || continue
            echo "=== 上传 $(basename $f) 到 R2 (app/) ==="
            if bash .github/scripts/upload-r2.sh "$f" "app"; then
              uploaded_count=$((uploaded_count + 1))
            else
              failed_count=$((failed_count + 1))
              echo "::warning::R2 上传失败: $f"
            fi
          done
          echo "✅ R2 上传完成：成功 $uploaded_count, 失败 $failed_count"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: 生成并推送 manifest 到网站
        if: env.CI_API_SECRET != '' && env.CI_API_URL != ''
        run: |
          chmod +x .github/scripts/update-manifest-incremental.sh
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          
          # 为每个上传的文件更新 manifest
          for f in dist/*; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")
            
            # 判断子目录
            case "$filename" in
              afrp-oidc-client_*) subdir="app" ;;
              luci-app-afrp_*|luci-app-afrp-*) subdir="app" ;;
              frpc_*) subdir="frpc" ;;
              *) continue ;;
            esac
            
            echo "=== 更新 manifest: $filename ($subdir) ==="
            FILE="$f" SUBDIR="$subdir" SITE_URL="${SITE_URL:-https://www.afrp.net}" \
              bash .github/scripts/update-manifest-incremental.sh "$f" "$subdir"
          done
          
          # 上传最终 manifest 到网站
          echo "📤 推送 manifest 到网站 API..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${CI_API_URL}/api/ci/update-manifest.php" \
            -H "Authorization: Bearer ${CI_API_SECRET}" \
            -F "manifest=@/tmp/manifest-updated.json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Manifest 推送失败 (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          echo "✅ Manifest 推送成功: $BODY"
        env:
          CI_API_SECRET: ${{ secrets.CI_API_SECRET }}
          CI_API_URL: ${{ secrets.CI_API_URL }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.afrp.net' }}

      - name: 输出统计信息
        run: |
          echo ""
          echo "=========================================="
          echo "📊 构建与上传统计"
          echo "=========================================="
          echo "  GitHub Release: ✅ 已完成"
          echo "  Cloudflare R2: 查看上方日志"
          echo "  Manifest 推送: 查看上方日志"
          echo "=========================================="
          echo "📥 下载链接："
          echo "  R2 (dl.afrp.net):"
          for f in dist/*; do
            [ -f "$f" ] && echo "    https://dl.afrp.net/app/$(basename $f)"
          done
          echo ""
